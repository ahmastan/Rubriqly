name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rubriqly-backend
    env:
      JEV_MODE: mock # CI must never call the real Jev API
      # Tests run their migrations against this throw-away Postgres, never against Neon.
      TEST_DATABASE_URL: postgresql://rubriqly:rubriqly@localhost:5432/rubriqly_test
    services:
      postgres:
        image: postgres:18 # same major version as Neon
        env:
          POSTGRES_USER: rubriqly
          POSTGRES_PASSWORD: rubriqly
          POSTGRES_DB: rubriqly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rubriqly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rubriqly-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rubriqly-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
